name: normativa-ar

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: normativa-ar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-normativa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-normativa}
      POSTGRES_DB: ${POSTGRES_DB:-normativa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
